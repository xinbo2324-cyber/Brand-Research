name: Rebuild dashboard data

on:
  push:
    branches: [main]
    paths:
      - brand-research-summary-live.xlsx
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build compressed dashboard data
        run: node build-dashboard-data.js
      - name: Commit generated data when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f brand-research-summary-live.json.gz
          git diff --cached --quiet || git commit -m "Rebuild dashboard data"
          git push
